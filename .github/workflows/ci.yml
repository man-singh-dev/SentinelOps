name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository
permissions:
  contents: read

env:
  # Password for the disposable Postgres/RabbitMQ service containers below.
  # Nothing is hardcoded: use the repository secret CI_SERVICE_PASSWORD when it
  # exists, otherwise a per-run value (secrets are not passed to fork PRs).
  # Keep any secret you set URL-safe (letters, digits, - and _), because it is
  # also placed inside DATABASE_URL.
  CI_SERVICE_PASSWORD: ${{ secrets.CI_SERVICE_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}

# A newer push to the same branch/PR makes an older, still-running run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    name: API - format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    # src/config/env.ts validates these at import time. Dummy values are fine:
    # nothing in this job connects to a database
    env:
      PORT: "3000"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint
      - name: TypeScript type check
        run: npx --no-install tsc --noEmit

      - name: Vitest
        run: npm test
  api-migrations:
    name: API - migrations and service readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    # DATABASE_URL is built from CI_SERVICE_PASSWORD in the first step below.
    env:
      PORT: "3000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ env.CI_SERVICE_PASSWORD }}
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_user
          RABBITMQ_DEFAULT_PASS: ${{ env.CI_SERVICE_PASSWORD }}
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build DATABASE_URL for later steps
        run: echo "DATABASE_URL=postgresql://ci_user:${CI_SERVICE_PASSWORD}@localhost:5432/ci_db" >> "$GITHUB_ENV"

      - name: Verify PostgreSQL accepts connections
        run: |
          node -e "
            const postgres = require('postgres');
            const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 10 });
            sql\`select version() as v\`
              .then(([row]) => { console.log(row.v); return sql.end(); })
              .catch((err) => { console.error('PostgreSQL probe failed:', err.message); process.exit(1); });
          "

      - name: Verify Redis responds to PING
        run: |
          exec 3<>/dev/tcp/127.0.0.1/6379
          printf 'PING\r\n' >&3
          read -r -t 5 reply <&3 || true
          echo "Redis replied: ${reply:-<nothing>}"
          [[ "$reply" == +PONG* ]]

      - name: Verify RabbitMQ management API
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused \
            --user "ci_user:${CI_SERVICE_PASSWORD}" \
            http://127.0.0.1:15672/api/overview | head -c 300
          echo

      - name: Apply migrations
        run: npm run db:migrate
      - name: Re-apply migrations (must be idempotent)
        run: npm run db:migrate

      - name: Verify migrations match the schema
        working-directory: .
        run: |
          (cd apps/api && npm run db:generate)
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "::error::Schema changes are not captured in db/migrations. Run 'npm run db:generate' in apps/api and commit the result."
            git status --short -- db/migrations
            exit 1
          fi

  worker-checks:
    name: Worker - gofmt, vet, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/worker/go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  compose-smoke:
    name: Docker Compose - up and healthy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start stack and wait for healthchecks
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: docker compose down --volumes